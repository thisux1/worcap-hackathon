<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <pattern id="pgrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#ff2a5f" stroke-opacity="0.05" />
    </pattern>
    <marker id="arr-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#39ff14" stroke-width="1.2"/></marker>
    <marker id="arr-p" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#ff2a5f" stroke-width="1.2"/></marker>
    <marker id="arr-c" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6272a4" stroke-width="1.2"/></marker>
    <marker id="arr-y" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#f1fa8c" stroke-width="1.2"/></marker>
  </defs>

  <rect width="880" height="470" fill="#090d13" />
  <rect x="10" y="10" width="860" height="450" rx="10" fill="url(#pgrid)" />
  <rect x="10" y="10" width="860" height="450" rx="10" fill="none" stroke="#ff2a5f" stroke-opacity="0.5" stroke-width="1.5" />

  <style>
    .box { fill: #0d1117; stroke-width: 1.5; }
    .t1 { font-family: 'Fira Code','JetBrains Mono',monospace; font-size: 13px; font-weight: bold; }
    .t2 { font-family: 'Fira Code','JetBrains Mono',monospace; font-size: 10.5px; fill: #6272a4; }
    .lbl { font-family: 'Fira Code','JetBrains Mono',monospace; font-size: 10px; fill: #6272a4; }
  </style>

  <!-- arestas: fontes -> hub -->
  <path d="M200 62 C 235 62, 230 150, 262 152" fill="none" stroke="#39ff14" stroke-opacity="0.55" stroke-width="1.3" marker-end="url(#arr-g)"/>
  <path d="M200 137 C 235 137, 230 165, 262 166" fill="none" stroke="#39ff14" stroke-opacity="0.55" stroke-width="1.3" marker-end="url(#arr-g)"/>
  <path d="M200 212 C 235 212, 230 185, 262 184" fill="none" stroke="#39ff14" stroke-opacity="0.55" stroke-width="1.3" marker-end="url(#arr-g)"/>
  <path d="M200 287 C 235 287, 230 200, 262 198" fill="none" stroke="#39ff14" stroke-opacity="0.55" stroke-width="1.3" marker-end="url(#arr-g)"/>

  <!-- hub -> modelos -->
  <path d="M452 160 C 480 160, 475 118, 505 116" fill="none" stroke="#ff2a5f" stroke-opacity="0.6" stroke-width="1.3" marker-end="url(#arr-p)"/>
  <path d="M452 190 C 480 190, 475 245, 505 243" fill="none" stroke="#ff2a5f" stroke-opacity="0.6" stroke-width="1.3" marker-end="url(#arr-p)"/>

  <!-- modelos -> blend -->
  <path d="M675 116 C 700 116, 695 168, 720 170" fill="none" stroke="#ff2a5f" stroke-opacity="0.6" stroke-width="1.3" marker-end="url(#arr-p)"/>
  <path d="M675 243 C 700 243, 695 190, 720 188" fill="none" stroke="#6272a4" stroke-opacity="0.7" stroke-width="1.3" marker-end="url(#arr-c)"/>
  <text x="694" y="128" class="lbl" fill="#ff79c6">w .65</text>
  <text x="694" y="256" class="lbl" fill="#6272a4">w .35</text>

  <!-- blend -> enso -> submission -->
  <path d="M792 220 L 792 300" fill="none" stroke="#f1fa8c" stroke-opacity="0.6" stroke-width="1.3" marker-end="url(#arr-y)"/>
  <path d="M715 335 L 670 335" fill="none" stroke="#8be9fd" stroke-opacity="0.6" stroke-width="1.3" marker-end="url(#arr-y)"/>
  <text x="785" y="265" text-anchor="end" class="lbl" fill="#f1fa8c">só fase ≠ neutra</text>

  <!-- pulsos viajando -->
  <circle r="3.5" fill="#39ff14" filter="url(#glow)"><animateMotion dur="2.2s" repeatCount="indefinite" path="M200 62 C 235 62, 230 150, 262 152"/></circle>
  <circle r="3.5" fill="#39ff14" filter="url(#glow)"><animateMotion dur="2.6s" begin="1.1s" repeatCount="indefinite" path="M200 287 C 235 287, 230 200, 262 198"/></circle>
  <circle r="3.5" fill="#ff2a5f" filter="url(#glow)"><animateMotion dur="1.8s" repeatCount="indefinite" path="M452 160 C 480 160, 475 118, 505 116"/></circle>
  <circle r="3.5" fill="#6272a4" filter="url(#glow)"><animateMotion dur="1.8s" begin="0.9s" repeatCount="indefinite" path="M675 243 C 700 243, 695 190, 720 188"/></circle>
  <circle r="3.5" fill="#f1fa8c" filter="url(#glow)"><animateMotion dur="1.4s" repeatCount="indefinite" path="M792 220 L 792 300"/></circle>

  <!-- fontes -->
  <g>
    <rect x="30" y="32" width="170" height="60" rx="8" class="box" stroke="#39ff14" stroke-opacity="0.8"/>
    <text x="115" y="57" text-anchor="middle" class="t1" fill="#39ff14">ERA5 oficial</text>
    <text x="115" y="76" text-anchor="middle" class="t2">9 vars · mês T−1</text>

    <rect x="30" y="107" width="170" height="60" rx="8" class="box" stroke="#39ff14" stroke-opacity="0.8"/>
    <text x="115" y="132" text-anchor="middle" class="t1" fill="#39ff14">ERSSTv5</text>
    <text x="115" y="151" text-anchor="middle" class="t2">índices + PDO (EOF1)</text>

    <rect x="30" y="182" width="170" height="60" rx="8" class="box" stroke="#39ff14" stroke-opacity="0.8"/>
    <text x="115" y="207" text-anchor="middle" class="t1" fill="#39ff14">ERA5 MSLP</text>
    <text x="115" y="226" text-anchor="middle" class="t2">proxy SAM 40S−65S</text>

    <rect x="30" y="257" width="170" height="60" rx="8" class="box" stroke="#39ff14" stroke-opacity="0.8"/>
    <text x="115" y="282" text-anchor="middle" class="t1" fill="#39ff14">NMME / SEAS5</text>
    <text x="115" y="301" text-anchor="middle" class="t2">lead-1 debiased · C3S</text>
  </g>

  <!-- hub -->
  <g>
    <rect x="262" y="130" width="190" height="90" rx="8" class="box" stroke="#ff2a5f" stroke-width="2" filter="url(#glow)">
      <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="357" y="163" text-anchor="middle" class="t1" fill="#ff2a5f">features_shared</text>
    <text x="357" y="182" text-anchor="middle" class="t2">108 cols · índices · lags</text>
    <text x="357" y="197" text-anchor="middle" class="t2">regiões · NMME anom</text>
  </g>

  <!-- modelos -->
  <g>
    <rect x="505" y="82" width="170" height="68" rx="8" class="box" stroke="#ff2a5f"/>
    <text x="590" y="108" text-anchor="middle" class="t1" fill="#ff2a5f">ridge global</text>
    <text x="590" y="127" text-anchor="middle" class="t2">por pixel · λ=1000</text>
    <text x="590" y="142" text-anchor="middle" class="t2">fit 1940–2022</text>

    <rect x="505" y="209" width="170" height="68" rx="8" class="box" stroke="#6272a4"/>
    <text x="590" y="235" text-anchor="middle" class="t1" fill="#6272a4">pixel-ridge</text>
    <text x="590" y="254" text-anchor="middle" class="t2">resíduo · λ2=300</text>
    <text x="590" y="269" text-anchor="middle" class="t2">lags + vizinhança</text>
  </g>

  <!-- blend -->
  <g>
    <rect x="720" y="152" width="145" height="68" rx="8" class="box" stroke="#f1fa8c"/>
    <text x="792" y="181" text-anchor="middle" class="t1" fill="#f1fa8c">blend</text>
    <text x="792" y="200" text-anchor="middle" class="t2">65% + 35%</text>
  </g>

  <!-- enso offset -->
  <g>
    <rect x="715" y="300" width="145" height="70" rx="8" class="box" stroke="#f1fa8c" stroke-dasharray="6 4"/>
    <text x="787" y="328" text-anchor="middle" class="t1" fill="#f1fa8c">enso_offset</text>
    <text x="787" y="346" text-anchor="middle" class="t2">β·(clim_fase−clim)</text>
    <text x="787" y="360" text-anchor="middle" class="t2">β=.25 pub / .33 pvt</text>
  </g>

  <!-- submission -->
  <g>
    <rect x="505" y="300" width="165" height="70" rx="8" class="box" stroke="#8be9fd" stroke-width="2" filter="url(#glow)">
      <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="2.2s" repeatCount="indefinite"/>
    </rect>
    <text x="587" y="330" text-anchor="middle" class="t1" fill="#8be9fd">submission.csv</text>
    <text x="587" y="348" text-anchor="middle" class="t2">1.885.464 linhas</text>
    <text x="587" y="362" text-anchor="middle" class="t2">splice [A ‖ β.33-2024]</text>
  </g>

  <!-- faixa validação -->
  <g>
    <rect x="30" y="405" width="835" height="44" rx="8" fill="none" stroke="#6272a4" stroke-dasharray="8 5" stroke-opacity="0.7"/>
    <text x="447" y="423" text-anchor="middle" class="t1" fill="#6272a4">anti-leakage</text>
    <text x="447" y="439" text-anchor="middle" class="t2">LOYO + embargo ±1a · climatologia / σ / compósitos refit por fold · features ≤ fim de T−1</text>
  </g>

  <!-- labels de coluna -->
  <text x="115" y="22" text-anchor="middle" class="lbl">dados ≤ T−1</text>
  <text x="357" y="112" text-anchor="middle" class="lbl">features</text>
  <text x="590" y="70" text-anchor="middle" class="lbl">modelos</text>
  <text x="792" y="140" text-anchor="middle" class="lbl">combinação</text>
</svg>

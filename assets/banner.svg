<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <linearGradient id="pink-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a5f" />
      <stop offset="100%" stop-color="#800c2a" />
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#ff2a5f" stroke-opacity="0.07" />
    </pattern>
    <clipPath id="frame"><rect x="10" y="10" width="860" height="220" rx="10" /></clipPath>
    <clipPath id="typeclip">
      <rect x="0" y="188" width="0" height="26">
        <animate attributeName="width" from="0" to="510" dur="2.6s" begin="0.6s" fill="freeze" />
      </rect>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="880" height="240" fill="#090d13" />
  <rect x="10" y="10" width="860" height="220" rx="10" fill="url(#grid)" />
  <rect x="10" y="10" width="860" height="220" rx="10" fill="none" stroke="#ff2a5f" stroke-width="1.5" filter="url(#glow)" />

  <g clip-path="url(#frame)">
    <rect x="10" y="12" width="860" height="7" fill="#ff2a5f" opacity="0.05">
      <animate attributeName="y" values="12;222;12" dur="9s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- chuva -->
  <g stroke-linecap="round">
    <line x1="592" y1="20" x2="592" y2="34" stroke="#39ff14" stroke-opacity="0.45" stroke-width="1.4">
      <animateTransform attributeName="transform" type="translate" values="0 -40;0 250" dur="1.9s" begin="0s" repeatCount="indefinite" />
    </line>
    <line x1="614" y1="20" x2="614" y2="32" stroke="#ff2a5f" stroke-opacity="0.4" stroke-width="1.4">
      <animateTransform attributeName="transform" type="translate" values="0 -60;0 250" dur="2.4s" begin="0.7s" repeatCount="indefinite" />
    </line>
    <line x1="638" y1="20" x2="638" y2="36" stroke="#6272a4" stroke-opacity="0.55" stroke-width="1.4">
      <animateTransform attributeName="transform" type="translate" values="0 -30;0 250" dur="2.1s" begin="1.3s" repeatCount="indefinite" />
    </line>
    <line x1="663" y1="20" x2="663" y2="33" stroke="#39ff14" stroke-opacity="0.35" stroke-width="1.4">
      <animateTransform attributeName="transform" type="translate" values="0 -80;0 250" dur="1.7s" begin="0.4s" repeatCount="indefinite" />
    </line>
    <line x1="688" y1="20" x2="688" y2="34" stroke="#ff79c6" stroke-opacity="0.4" stroke-width="1.4">
      <animateTransform attributeName="transform" type="translate" values="0 -50;0 250" dur="2.6s" begin="1.8s" repeatCount="indefinite" />
    </line>
    <line x1="712" y1="20" x2="712" y2="35" stroke="#6272a4" stroke-opacity="0.45" stroke-width="1.4">
      <animateTransform attributeName="transform" type="translate" values="0 -20;0 250" dur="2.0s" begin="0.9s" repeatCount="indefinite" />
    </line>
    <line x1="826" y1="20" x2="826" y2="32" stroke="#39ff14" stroke-opacity="0.4" stroke-width="1.4">
      <animateTransform attributeName="transform" type="translate" values="0 -70;0 250" dur="2.2s" begin="1.1s" repeatCount="indefinite" />
    </line>
    <line x1="848" y1="20" x2="848" y2="34" stroke="#ff2a5f" stroke-opacity="0.35" stroke-width="1.4">
      <animateTransform attributeName="transform" type="translate" values="0 -45;0 250" dur="1.8s" begin="0.2s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- radar -->
  <g>
    <circle cx="775" cy="95" r="52" fill="none" stroke="#6272a4" stroke-width="1" stroke-dasharray="5 7" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0 775 95" to="360 775 95" dur="28s" repeatCount="indefinite" />
    </circle>
    <circle cx="775" cy="95" r="30" fill="none" stroke="#ff2a5f" stroke-width="1" stroke-dasharray="3 5" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="360 775 95" to="0 775 95" dur="18s" repeatCount="indefinite" />
    </circle>
    <circle cx="775" cy="95" r="9" fill="#ff2a5f" filter="url(#soft)">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="2.6s" repeatCount="indefinite" />
      <animate attributeName="r" values="8;11;8" dur="2.6s" repeatCount="indefinite" />
    </circle>
    <text x="775" y="168" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',monospace" font-size="11" fill="#6272a4">SA · 0.25°</text>
  </g>

  <!-- titulo -->
  <text x="44" y="86" font-family="'Fira Code','JetBrains Mono','Courier New',monospace" font-size="47" font-weight="bold" fill="url(#pink-grad)" filter="url(#glow)" letter-spacing="2">WORCAP_2026</text>
  <text x="46" y="118" font-family="'Fira Code','JetBrains Mono',monospace" font-size="15" fill="#e2e8f0">// previsão de precipitação mensal · América do Sul · INPE/Kaggle</text>

  <g font-family="'Fira Code','JetBrains Mono',monospace" font-size="12">
    <rect x="46" y="136" width="64" height="22" rx="4" fill="none" stroke="#39ff14" stroke-opacity="0.6" />
    <text x="78" y="151" text-anchor="middle" fill="#39ff14">ERA5</text>
    <rect x="118" y="136" width="84" height="22" rx="4" fill="none" stroke="#6272a4" stroke-opacity="0.7" />
    <text x="160" y="151" text-anchor="middle" fill="#6272a4">ERSSTv5</text>
    <rect x="210" y="136" width="70" height="22" rx="4" fill="none" stroke="#f1fa8c" stroke-opacity="0.5" />
    <text x="245" y="151" text-anchor="middle" fill="#f1fa8c">NMME</text>
    <rect x="288" y="136" width="130" height="22" rx="4" fill="none" stroke="#ff2a5f" stroke-opacity="0.7" />
    <text x="353" y="151" text-anchor="middle" fill="#ff2a5f">LOYO + embargo</text>
  </g>

  <!-- prompt -->
  <g font-family="'Fira Code','JetBrains Mono',monospace" font-size="13.5">
    <text x="44" y="205" fill="#39ff14">$</text>
    <g clip-path="url(#typeclip)">
      <text x="60" y="205" fill="#e2e8f0">run ridge + pixel-ridge → blend 65/35 → enso β=0.33</text>
    </g>
    <rect x="500" y="194" width="9" height="15" fill="#ff2a5f">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1.1s" repeatCount="indefinite" />
    </rect>
    <text x="836" y="205" text-anchor="end" fill="#f1fa8c" font-size="12">[ RMSE 1.68586 ]</text>
  </g>
</svg>
